name: Audit Aspen Grove Branch Protection

on:
  workflow_dispatch:
    inputs:
      required_check:
        description: Exact GitHub required-check context to audit
        required: true
        default: Aspen Grove Contract / validate
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Calculate proposed protection without writing
        run: |
          python governance/apply_aspen_grove_branch_protection.py \
            --required-check "${{ inputs.required_check }}" \
            --receipt artifacts/aspen-grove-branch-protection-receipt.json \
            --dry-run

      - name: Upload audit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aspen-grove-branch-protection-audit-${{ github.run_id }}
          path: artifacts/aspen-grove-branch-protection-receipt.json
          if-no-files-found: error
          retention-days: 90
