name: Aspen Grove Health Reusable

on:
  workflow_call:
    inputs:
      profile:
        description: Grove structural-health profile
        required: true
        type: string
  workflow_dispatch:
    inputs:
      profile:
        description: Grove structural-health profile
        required: true
        type: string
        default: core

permissions:
  contents: read

jobs:
  health:
    name: health
    runs-on: ubuntu-latest
    env:
      GROVE_PROFILE: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generate governed structural-health receipt
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import subprocess
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('.')
          contract_path = root / '.glaciereq' / 'aspen-grove.node.json'
          readme_path = root / 'README.md'
          profile = os.environ.get('GROVE_PROFILE', '').strip()
          repository = os.environ.get('GITHUB_REPOSITORY', '')
          run_id = os.environ.get('GITHUB_RUN_ID', '')
          checks: list[dict] = []

          def add(name: str, state: str, detail: str, required: bool = True) -> None:
              checks.append({
                  'name': name,
                  'state': state,
                  'detail': detail,
                  'required': required,
              })

          contract = None
          if contract_path.exists():
              try:
                  contract = json.loads(contract_path.read_text(encoding='utf-8'))
                  add('node_contract', 'PASS', str(contract_path))
              except Exception as exc:
                  add('node_contract', 'FAIL', f'invalid JSON: {exc}')
          else:
              add('node_contract', 'FAIL', 'missing .glaciereq/aspen-grove.node.json')

          if readme_path.exists():
              readme = readme_path.read_text(encoding='utf-8')
              add('readme', 'PASS', 'README.md present')
          else:
              readme = ''
              add('readme', 'FAIL', 'README.md missing')

          if contract:
              add(
                  'repository_identity',
                  'PASS' if contract.get('repository') == repository else 'FAIL',
                  f"contract={contract.get('repository')} runtime={repository}",
              )
              expected_profile = {
                  'constellation_root_memory_context_router': 'core',
                  'integrated_runtime_projection': 'runtime',
                  'memory_specialization': 'memory',
                  'connector_specialization': 'connectors',
                  'persistence_specialization': 'persistence',
                  'agent_orchestration_specialization': 'swarm',
                  'evidence_forensics_specialization': 'evidence',
                  'legal_work_product_specialization': 'legal',
                  'case_context_specialization': 'case',
              }.get(contract.get('role'))
              add(
                  'health_profile',
                  'PASS' if expected_profile == profile else 'FAIL',
                  f'expected={expected_profile} configured={profile}',
              )

          required_terms = {
              'core': ['constellation', 'router'],
              'runtime': ['runtime', 'projection'],
              'memory': ['memory', 'continuity'],
              'connectors': ['connector', 'health'],
              'persistence': ['supabase', 'security'],
              'swarm': ['swarm', 'agent'],
              'evidence': ['evidence', 'provenance'],
              'legal': ['legal', 'authority'],
              'case': ['case', 'evidence'],
          }.get(profile, [])
          lower_readme = readme.lower()
          for term in required_terms:
              add(
                  f'readme_term:{term}',
                  'PASS' if term.lower() in lower_readme else 'FAIL',
                  f"README contains '{term}'"
                  if term.lower() in lower_readme
                  else f"README missing '{term}'",
              )

          try:
              commit_time = subprocess.check_output(
                  ['git', 'log', '-1', '--format=%cI'],
                  text=True,
              ).strip()
              add('git_head', 'PASS', commit_time)
          except Exception as exc:
              add('git_head', 'FAIL', f'unavailable: {exc}')

          required_failures = [
              check
              for check in checks
              if check['required'] and check['state'] != 'PASS'
          ]
          status = 'FAIL' if required_failures else 'PASS'
          receipt = {
              'schema_id': 'glaciereq.aspen-grove-health-receipt.v1',
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'repository': repository,
              'grove_id': contract.get('grove_id') if contract else None,
              'role': contract.get('role') if contract else None,
              'profile': profile,
              'status': status,
              'scope': 'repository-local structural verification only',
              'runtime_claim': 'No provider connectivity or external health is asserted.',
              'checks': checks,
              'source': {
                  'run_id': run_id,
                  'sha': os.environ.get('GITHUB_SHA'),
                  'workflow': os.environ.get('GITHUB_WORKFLOW'),
              },
          }

          output = root / 'artifacts' / 'aspen-grove-health-receipt.json'
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(receipt, indent=2))
          if required_failures:
              sys.exit(1)
          PY

      - name: Upload health receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aspen-grove-health-${{ github.repository_id }}-${{ github.run_id }}
          path: artifacts/aspen-grove-health-receipt.json
          if-no-files-found: error
          retention-days: 90
