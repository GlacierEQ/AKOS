name: Career Intelligence Runtime

on:
  pull_request:
    paths:
      - "career_intelligence/**"
      - "tests/test_career_intelligence.py"
      - "pyproject.toml"
      - ".github/workflows/career-intelligence.yml"
  push:
    branches: [main]
    paths:
      - "career_intelligence/**"
      - "tests/test_career_intelligence.py"
      - "pyproject.toml"
      - ".github/workflows/career-intelligence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check career_intelligence tests/test_career_intelligence.py
      - run: python -m compileall -q career_intelligence tests/test_career_intelligence.py
      - run: pytest -q tests/test_career_intelligence.py
      - run: >-
          akos-career build
          --output artifacts/career-package
          --role "Principal AI Systems Engineer"
          --audience "technical hiring panel"
      - run: akos-career verify --output artifacts/career-package
      - uses: actions/upload-artifact@v4
        with:
          name: career-intelligence-${{ matrix.python-version }}
          path: artifacts/career-package
          if-no-files-found: error
