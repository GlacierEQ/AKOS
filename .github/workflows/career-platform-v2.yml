name: Career Intelligence Platform v2

on:
  pull_request:
    paths:
      - "career_intelligence/**"
      - "stones/*/stone.json"
      - "gauntlets/career-intelligence-platform-v2.json"
      - "tests/test_career_platform_v2.py"
      - "docs/CAREER_INTELLIGENCE_PLATFORM_V2.md"
      - "pyproject.toml"
      - ".github/workflows/career-platform-v2.yml"
  push:
    branches: [main]
    paths:
      - "career_intelligence/**"
      - "stones/*/stone.json"
      - "gauntlets/career-intelligence-platform-v2.json"
      - "tests/test_career_platform_v2.py"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check career_intelligence tests/test_career_platform_v2.py
      - run: python -m compileall -q career_intelligence tests/test_career_platform_v2.py
      - run: pytest -q tests/test_career_intelligence.py tests/test_career_platform_v2.py
      - run: build-career --output artifacts/career-platform-v2 --target "Principal AI Systems Engineer" --audience principal-engineer
      - run: build-career --output artifacts/career-platform-v2 --verify-only
      - uses: actions/upload-artifact@v4
        with:
          name: career-platform-v2-${{ matrix.python-version }}
          path: artifacts/career-platform-v2
          if-no-files-found: error
