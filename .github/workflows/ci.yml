name: AKOS Verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: akos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime and verification dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint executable AKOS surfaces
        run: >-
          ruff check
          operational_cognition
          finisher
          src
          scripts
          tests

      - name: Compile executable Python surfaces
        run: >-
          python -m compileall -q
          operational_cognition
          finisher
          src
          scripts
          tests

      - name: Verify recruiter, expert, and AI README contract
        run: python scripts/verify_readme_contract.py

      - name: Run all tests and require a positive test count
        run: python scripts/verify_repository.py --output artifacts/ci/test-receipt.json

      - name: Upload AKOS verification receipt
        if: ${{ always() && hashFiles('artifacts/ci/test-receipt.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: akos-test-receipt-py${{ matrix.python-version }}
          path: artifacts/ci/test-receipt.json
          if-no-files-found: error
