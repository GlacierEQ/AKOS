name: AKOS Verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: akos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime and verification dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Strictly lint the new verification control surface
        run: ruff check scripts/verify_repository.py scripts/verify_readme_contract.py

      - name: Capture preexisting AKOS quality debt without hiding it
        shell: bash
        run: |
          mkdir -p artifacts/ci
          set +e
          ruff check operational_cognition finisher src tests \
            --output-format json > artifacts/ci/ruff-baseline.json
          status=$?
          set -e
          python - "$status" <<'PY'
          import json
          import sys
          from pathlib import Path

          status = int(sys.argv[1])
          report = Path("artifacts/ci/ruff-baseline.json")
          findings = json.loads(report.read_text(encoding="utf-8"))
          summary = {
              "schema": "glaciereq.akos.ruff-baseline.v1",
              "conclusion": "DEBT_RECORDED" if findings else "CLEAN",
              "ruff_exit_code": status,
              "finding_count": len(findings),
          }
          Path("artifacts/ci/ruff-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Compile executable Python surfaces
        run: >-
          python -m compileall -q
          operational_cognition
          finisher
          src
          scripts
          tests

      - name: Verify recruiter, expert, and AI README contract
        run: python scripts/verify_readme_contract.py

      - name: Run all tests and require a positive test count
        run: python scripts/verify_repository.py --output artifacts/ci/test-receipt.json

      - name: Upload AKOS verification evidence
        if: ${{ always() && hashFiles('artifacts/ci/**/*') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: akos-verification-py${{ matrix.python-version }}
          path: artifacts/ci/
          if-no-files-found: error
