name: AKOS Finisher Verification

on:
  pull_request:
    paths:
      - "finisher/**"
      - ".github/workflows/finisher.yml"
  push:
    branches: [main]
    paths:
      - "finisher/**"
      - ".github/workflows/finisher.yml"

permissions:
  contents: read

concurrency:
  group: akos-finisher-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Finisher
        run: python -m compileall -q finisher

      - name: Run Finisher tests
        run: python -m pytest -q finisher/test_finisher.py

# Governed cross-repository finishing, private-token use, apply operations, and
# durable workload receipts belong to GlacierEQ/public-actions-runner-host.
# This workflow intentionally stops at read-only repository-local verification.
