name: Infinity Stone Forge

on:
  push:
    branches: ["main"]
    paths:
      - "infinity_stones/**"
      - "stones/**"
      - "upgrades/**"
      - "kernel/**"
      - "registry/**"
      - "schemas/infinity-*.json"
      - "proto/infinity_stone_projection.proto"
      - "gauntlets/**"
      - "scripts/verify_stones.py"
      - "tests/test_infinity_stones.py"
      - "tests/test_projection_layers.py"
      - "tests/test_psysoc_x.py"
      - "pyproject.toml"
      - ".github/workflows/infinity-stones.yml"
  pull_request:
    paths:
      - "infinity_stones/**"
      - "stones/**"
      - "upgrades/**"
      - "kernel/**"
      - "registry/**"
      - "schemas/infinity-*.json"
      - "proto/infinity_stone_projection.proto"
      - "gauntlets/**"
      - "scripts/verify_stones.py"
      - "tests/test_infinity_stones.py"
      - "tests/test_projection_layers.py"
      - "tests/test_psysoc_x.py"
      - "pyproject.toml"
      - ".github/workflows/infinity-stones.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: Lint forge
        run: >-
          ruff check infinity_stones scripts/verify_stones.py
          tests/test_infinity_stones.py tests/test_projection_layers.py
          tests/test_psysoc_x.py
      - name: Compile forge
        run: python -m compileall -q infinity_stones scripts/verify_stones.py
      - name: Run forge tests
        run: >-
          pytest -q tests/test_infinity_stones.py tests/test_projection_layers.py
          tests/test_psysoc_x.py
      - name: Emit verification and projection receipts
        run: >-
          akos-verify-stones
          --output artifacts/ci/infinity-stone-receipt.json
          --projection-output artifacts/ci/infinity-stone-projections.json
      - uses: actions/upload-artifact@v4
        with:
          name: infinity-stone-receipt-py${{ matrix.python }}
          path: artifacts/ci/infinity-stone-receipt.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.python == '3.13' }}
        with:
          name: infinity-stone-four-layer-projections
          path: artifacts/ci/infinity-stone-projections.json
          if-no-files-found: error
          retention-days: 7
