name: Infinity Stone Forge

on:
  pull_request:
    paths:
      - "infinity_stones/**"
      - "stones/**"
      - "upgrades/**"
      - "kernel/**"
      - "registry/**"
      - "schemas/infinity-*.json"
      - "gauntlets/**"
      - "scripts/verify_stones.py"
      - "tests/test_infinity_stones.py"
      - "tests/test_psysoc_x.py"
      - "pyproject.toml"
      - ".github/workflows/infinity-stones.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: Lint forge
        run: >-
          ruff check infinity_stones scripts/verify_stones.py
          tests/test_infinity_stones.py tests/test_psysoc_x.py
      - name: Compile forge
        run: python -m compileall -q infinity_stones scripts/verify_stones.py
      - name: Run forge tests
        run: pytest -q tests/test_infinity_stones.py tests/test_psysoc_x.py
      - name: Emit verification receipt
        run: akos-verify-stones --output artifacts/ci/infinity-stone-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: infinity-stone-receipt-py${{ matrix.python }}
          path: artifacts/ci/infinity-stone-receipt.json
          if-no-files-found: error
          retention-days: 90
