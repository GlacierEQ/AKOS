name: Nervous System Contract

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .glaciereq/nervous-system.node.json
      - governance/glaciereq.nervous-system.v1.json
      - governance/validate_nervous_system.py
      - .github/workflows/nervous-system-contract.yml
  pull_request:
    paths:
      - README.md
      - .glaciereq/nervous-system.node.json
      - governance/glaciereq.nervous-system.v1.json
      - governance/validate_nervous_system.py
      - .github/workflows/nervous-system-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate canonical nervous-system contract
        run: python governance/validate_nervous_system.py
