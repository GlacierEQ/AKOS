name: Resume Master Infinity Stones

on:
  pull_request:
    paths:
      - "registry/stones.json"
      - "stones/resume-master/**"
      - "stones/web-design-pro/**"
      - "upgrades/resume-do-it-again/**"
      - "gauntlets/resume-master-psysoc-x-web-design-pro.json"
      - "scripts/verify_resume_master_stones.py"
      - "tests/test_resume_master_stones.py"
      - ".github/workflows/resume-master-stones.yml"
  push:
    branches: [main]
    paths:
      - "registry/stones.json"
      - "stones/resume-master/**"
      - "stones/web-design-pro/**"
      - "upgrades/resume-do-it-again/**"
      - "gauntlets/resume-master-psysoc-x-web-design-pro.json"
      - "scripts/verify_resume_master_stones.py"
      - "tests/test_resume_master_stones.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resume-master-stones-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall infinity_stones scripts tests
      - run: pytest -q tests/test_resume_master_stones.py
      - run: mkdir -p artifacts/ci
      - run: >
          python scripts/verify_resume_master_stones.py
          --output artifacts/ci/resume-master-stones-${{ matrix.python-version }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: resume-master-stones-${{ matrix.python-version }}
          path: artifacts/ci/resume-master-stones-${{ matrix.python-version }}.json
          if-no-files-found: error
