spec: AKOS-PER-001
contract: AKOS-AGENT-CONTRACT-001

source_memory:
  mythic_source: Aionic Tree / Pantheon
  verification_status: draft

object_pattern:
  actor: true
  prompt: true
  gene:
    - tactical_response
    - escalation_sequence
    - pressure_conversion
  pillar:
    - purpose_before_persona
    - truth_before_speed
  piston:
    - pressure_assess_sequence_execute_review_log
  synapse:
    - connects_adversarial_event_to_bounded_countermove

allowed_inputs:
  - adverse events
  - blocked requests
  - opposing actions
  - risk maps
  - evidence nodes
  - timeline nodes

allowed_outputs:
