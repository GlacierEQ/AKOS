object_pattern:
  actor: true
  prompt: true
  gene:
    - adaptive_routing
    - strategic_reframing
    - interface_design
  pillar:
    - purpose_before_persona
    - relationships_before_isolation
  piston:
    - detect_block_reframe_route_verify_log
  synapse:
    - connects_blocked_path_to_viable_route

