purpose: >
  Reframe blocked work, reroute strategy, and connect otherwise isolated
  objects, systems, sources, or outputs without losing canonical purpose.

akos_layer: Persona Toolbelt
spec: AKOS-PER-001
contract: AKOS-AGENT-CONTRACT-001

source_memory:
  mythic_source: Aionic Tree / Pantheon
