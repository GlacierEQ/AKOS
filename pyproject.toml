[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "akos-operational-cognition"
version = "0.9.0"
description = "Evidence-bound governance, reversible Infinity Stone specializations, and deterministic career intelligence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Casey Barton" }]
dependencies = [
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
akos-verify = "scripts.verify_repository:main"
akos-verify-readme = "scripts.verify_readme_contract:main"
akos-verify-stones = "scripts.verify_stones:main"
akos-career = "career_intelligence.cli:main"
build-career = "career_intelligence.gauntlet_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "operational_cognition*",
  "finisher*",
  "scripts*",
  "infinity_stones*",
  "career_intelligence*",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = [".integrity", "operational_cognition", "finisher", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  ".integrity",
  "artifacts",
  "finisher/out",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = [
  "infinity_stones",
  "operational_cognition",
  "finisher",
  "scripts",
  "career_intelligence",
]

[tool.ruff.lint.per-file-ignores]
"career_intelligence/ats.py" = ["E501"]
"career_intelligence/builder.py" = ["E501"]
"career_intelligence/cli.py" = ["E501"]
"career_intelligence/documents.py" = ["E501", "RUF001", "UP012"]
"career_intelligence/gauntlet_cli.py" = ["E501"]
"career_intelligence/interview.py" = ["E501"]
"career_intelligence/job_intelligence.py" = ["E501"]
"career_intelligence/persona_council.py" = ["E501"]
"career_intelligence/platform_artifacts.py" = ["E501", "RUF001"]
"career_intelligence/platform_builder.py" = ["E501", "UP035"]
"career_intelligence/platform_common.py" = ["UP035"]
"career_intelligence/platform_verify.py" = ["E501", "SIM300", "UP035"]
"career_intelligence/portfolio.py" = ["E501", "E702"]
"career_intelligence/renderers.py" = ["E501", "RUF001"]
"career_intelligence/resources_index.py" = ["UP035"]
"career_intelligence/skill_ontology.py" = ["E501", "UP035"]
"career_intelligence/validation.py" = ["E501"]
"tests/test_career_intelligence.py" = ["E501"]
"tests/test_career_platform_v2.py" = ["E501", "I001"]
